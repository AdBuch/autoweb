<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoweb</title>
<style>
  :root { --bar-bg: rgba(14,16,22,.94); --line: rgba(255,255,255,.12); --ink: #e8eaf0; --mute: #9aa0ae; --acc: #6e8bff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #stage { flex: 1; border: 0; width: 100%; background: #fff; }
  #bar { background: var(--bar-bg); color: var(--ink); border-top: 1px solid var(--line); padding: 10px 14px; }
  #status { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--mute); margin-bottom: 8px; min-height: 18px; }
  #status .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  #status a { color: var(--acc); text-decoration: none; }
  #status a:hover { text-decoration: underline; }
  #status .err { color: #ff8080; }
  #composer { display: flex; gap: 8px; }
  #prompt { flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); padding: 10px 12px; font: inherit; outline: none; }
  #prompt::placeholder { color: var(--mute); }
  #prompt:focus { border-color: var(--acc); }
  #send { background: var(--acc); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; cursor: pointer; }
  #send:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<iframe id="stage" src="/site/" title="website"></iframe>
<div id="bar">
  <div id="status"></div>
  <form id="composer">
    <input id="prompt" autocomplete="off" placeholder="Describe what you want this website to be or change…" autofocus>
    <button id="send" type="submit">Build</button>
  </form>
</div>
<script>
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const form = document.getElementById('composer');
const input = document.getElementById('prompt');
const send = document.getElementById('send');

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function agentChip(s) {
  return `<span class="chip">agent: ${esc(s.provider)}${s.model ? ' / ' + esc(s.model) : ''}${s.mode === 'mock' || s.provider === 'mock' ? ' (mock)' : ''}</span>`;
}

function renderStatus(s) {
  const parts = [agentChip(s)];
  if (s.repo) parts.push(`<span class="chip">repo: ${esc(s.repo)}</span>`);
  const last = (s.history && s.history[0]) || null;
  if (last) {
    const link = last.commitUrl
      ? ` · <a href="${esc(last.commitUrl)}" target="_blank" rel="noopener">commit ${esc((last.commitSha || '').slice(0, 7))}</a>`
      : last.pushed === false ? ' · not pushed' : '';
    parts.push(`<span>last: “${esc(last.prompt)}” — ${esc(last.summary || '')}${link}</span>`);
  }
  statusEl.innerHTML = parts.join(' ');
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    if (r.ok) renderStatus(await r.json());
  } catch {}
}

function setBusy(b) {
  send.disabled = b;
  input.disabled = b;
  send.textContent = b ? 'Building…' : 'Build';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  setBusy(true);
  statusEl.innerHTML = `<span>agent is building: “${esc(prompt)}”…</span>`;
  try {
    const r = await fetch('/api/prompt', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    input.value = '';
    stage.src = '/site/?v=' + Date.now();
    const link = d.commitUrl
      ? ` · <a href="${esc(d.commitUrl)}" target="_blank" rel="noopener">commit ${esc((d.commitSha || '').slice(0, 7))}</a>`
      : d.pushed === false ? ' · not pushed' : '';
    statusEl.innerHTML = `${agentChip(d)}<span>“${esc(d.prompt)}” → ${esc(d.summary || '')}${link}</span>`;
  } catch (err) {
    statusEl.innerHTML = `<span class="err">error: ${esc(err.message)}</span>`;
  } finally {
    setBusy(false);
    input.focus();
  }
});

refresh();
</script>
</body>
</html>
